<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali</title>
    <style>
        /* Reset and Theme Styling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #2c1602 0%, #0d0601 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #ffffff;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 165, 0, 0.6), 0 0 40px rgba(255, 69, 0, 0.4);
            letter-spacing: 2px;
        }

        p {
            font-size: 1.3rem;
            color: #ffcc80;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Falling Leaf / Flower Container */
        .diwali-particle {
            position: absolute;
            top: -10%;
            z-index: 5;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite, sway ease-in-out infinite;
        }

        .diwali-particle svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 5px rgba(255, 165, 0, 0.5));
        }

        /* Keyframe Animations */
        @keyframes fall {
            0% {
                top: -10%;
            }
            100% {
                top: 110%;
            }
        }

        @keyframes sway {
            0%, 100% {
                transform: translateX(0deg) rotate(0deg);
            }
            50% {
                transform: translateX(40px) rotate(180deg);
            }
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>✨ Happy Diwali ✨</h1>
        <p>May your celebration be filled with light, joy, and prosperity.</p>
    </div>

    <!-- JavaScript to dynamically generate falling festive petals/leaves -->
    <script>
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('diwali-particle');

            // Random positioning and sizing for organic motion
            const startX = Math.random() * window.innerWidth;
            const size = Math.random() * 15 + 15; // Between 15px and 30px
            const fallDuration = Math.random() * 5 + 6; // Between 6s and 11s
            const swayDuration = Math.random() * 3 + 2; // Between 2s and 5s
            const delay = Math.random() * 5; // Stagger start times

            particle.style.left = `${startX}px`;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
            particle.style.animationDelay = `${delay}s`;

            // SVG shape representing a festive marigold petal or leaf shape in golden/orange hues
            particle.innerHTML = `
                <svg viewBox="0 0 24 24" fill="${getFestiveColor()}">
                    <path d="M12,2C8,6 4,10 4,14A8,8 0 0,0 20,14C20,10 16,6 12,2Z"/>
                </svg>
            `;

            document.body.appendChild(particle);

            // Clean up element after animation completes to keep memory clean
            setTimeout(() => {
                particle.remove();
            }, (fallDuration + delay) * 1000);
        }

        // Helper to pick bright festive colors (golds, oranges, warm yellows, ruby reds)
        function getFestiveColor() {
            const colors = ['#FFD700', '#FFA500', '#FF8C00', '#FF4500', '#FFC107'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Continuously generate particles
        setInterval(createParticle, 250);
    </script>
</body>
</html>
